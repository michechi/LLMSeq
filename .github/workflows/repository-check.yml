name: Repository contents
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked files
        run: python3 scripts/check_repository.py
      - name: Check maintenance utilities
        run: python3 -m unittest discover -s tests/maintenance -v
