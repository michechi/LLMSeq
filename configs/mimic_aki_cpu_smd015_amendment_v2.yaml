schema_version: 1

cohort:
  creatinine_itemid: 50912
  adult:
    minimum_age_years: 18
    minimum_age_inclusive: true
    age_calculation: anchor_year_delta
  admission:
    eligible_types: all
    type_matching: exact
    minimum_stay_hours: 0
    minimum_stay_inclusive: true
    charttime_boundary: both
    null_hadm_policy: reject
    administrative_end_policy: earliest_discharge_or_death
    invalid_death_time_policy: exclude_admission
  minimum_measurements: 3
  measurement_count_basis: distinct_timestamps
  missing_specimen_id_policy: exclude_from_count

cleaning:
  numeric_value_source: valuenum_only
  canonical_unit: mg/dL
  unit_matching: casefold_strip
  missing_unit_policy: reject
  unit_conversions:
    - aliases: [mg/dL]
      multiplier: 1.0
      offset: 0.0
  valid_range_mg_dl:
    minimum: 0.1
    maximum: 30.0
    boundary: both
  deduplication:
    ordering: labevent_id
    exact:
      key: [subject_id, hadm_id, labevent_id]
      policy: keep_first
    simultaneous:
      enabled: false
      key: [subject_id, hadm_id, specimen_time]
      value_tolerance_mg_dl: 0.0
      concordant_policy: keep_first
      conflicting_policy: reject_all

episodes:
  columns:
    timestamp: specimen_time
    value: creatinine_mg_dl
    subject_id: subject_id
    hadm_id: hadm_id
  admission_bounded: true
  baseline:
    method: minimum
    lookback_hours: 48
    minimum_measurements: 1
  onset:
    absolute_rise_mg_dl: 0.3
    window_hours: 48
    boundary: inclusive
    tie_breaker: earliest
  recovery:
    threshold_above_baseline_mg_dl: 0.3
    window_hours: 48
    time_boundary: inclusive
    value_comparison: lt
    sustained_hours: 48
  follow_up:
    duration_days: 7
    boundary: inclusive
  peak:
    window_end: follow_up
    boundary: inclusive
    tie_breaker: earliest
  relapse:
    window_days: 7
    anchor: onset
    comparator: recovery_nadir
    boundary: inclusive
  observation:
    max_gap_hours: 48
    endpoint_tolerance_hours: 24
    minimum_post_onset_measurements: 3
  duplicates:
    exact: drop
    conflicting_timestamp: ambiguous
  admission_censoring:
    hadm_id_column: hadm_id
    discharge_time_column: dischtime
    death_time_column: deathtime
    endpoint_precedence: death_then_discharge
    horizon_boundary: inclusive
    unknown_endpoint_reason: missing_or_unusable_admission_endpoint
  recovery_timing_sensitivity:
    enabled: true
    reference_time_column: peak_time
    baseline_column: baseline_value
    threshold_above_baseline_mg_dl: 0.3
    value_comparison: lt
    fast_max_hours: 48
    intermediate_max_hours: 240
    time_boundary: inclusive
    sustained_hours: 48
    max_gap_hours: 48
    endpoint_tolerance_hours: 24
    minimum_measurements: 5
    duplicate_policy: error

representations:
  window_start_column: baseline_start_time
  window_end_column: follow_up_end_time
  window_start_boundary: inclusive
  window_end_boundary: inclusive
  max_length: 512
  truncation: error
  value_transform: delta_from_baseline
  time_features:
    - elapsed_hours
    - delta_hours
    - time_since_onset_hours
  summary_features:
    - count
    - distinct_count
    - min
    - max
    - mean
    - std
    - median
    - range
    - repeated_min_count
    - repeated_max_count
    - duration_hours
    - gap_mean_hours
    - gap_std_hours
    - gap_min_hours
    - gap_max_hours
    - q05
    - q10
    - q25
    - q75
    - q90
    - q95
  slope_hours_per_unit: 24
  permutation_seeds: [61001, 61002, 61003]

matching:
  class_a: transient
  class_b: persistent
  selection_seed: 41001
  coarsening:
    count:
      method: exact
    baseline_creatinine_mg_dl:
      method: width
      width: 0.25
      origin: 0.0
    peak_value:
      method: width
      width: 0.25
      origin: 0.0
    duration_hours:
      method: width
      width: 24
      origin: 0.0
  minimum_pairs_per_split:
    train: 500
    validation: 100
    test: 100
  maximum_absolute_smd: 0.1
  maximum_absolute_smd_overrides:
    duration_hours: 0.15

splitting:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  stratification: phenotype_signature
  split_seed: 31001
  rare_stratum_policy: error

models:
  seeds: [51001, 51002, 51003]
  tabular_preprocessing:
    scaling: standard
    missing_values: error
  sequence_preprocessing:
    scaling: standard
    missing_values: error
  sequence_training:
    batch_size: 128
    max_epochs: 100
    learning_rate: 0.001
    weight_decay: 0.0001
    optimizer: adamw
    patience: 10
    min_delta: 0.0001
    early_stopping_metric: validation_loss
    device: cpu
    num_workers: 4
    pin_memory: false
    deterministic_algorithms: true
    class_weight: balanced
    gradient_clip_norm: 1.0
    optimizer_parameters:
      betas: [0.9, 0.999]
      eps: 1.0e-8
      amsgrad: false
  lstm:
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    bidirectional: false
    projection_dim: null
  transformer:
    d_model: 64
    nhead: 8
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.1
    max_sequence_length: 512
    positional_encoding: sinusoidal
    pooling: mean
  logistic_regression:
    C: 1.0
    penalty: l2
    solver: lbfgs
    max_iter: 2000
    tol: 1.0e-6
    fit_intercept: true
    class_weight: balanced
    n_jobs: 1
  xgboost:
    parameters:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.03
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      objective: multi:softprob
      eval_metric: mlogloss
      n_jobs: 8
      tree_method: hist
      verbosity: 0
    fit_parameters: {}
    class_weight: balanced

metrics:
  binary:
    labels: [transient, persistent]
    threshold: 0.5
    positive_label: persistent
    missing_class_policy: raise
    zero_division: 0
  multiclass:
    labels: [transient, persistent, relapsing]
    decision_rule: argmax
    missing_class_policy: raise
    zero_division: 0
  aggregation:
    ddof: 1
  bootstrap:
    n_resamples: 5000
    confidence_level: 0.95
    seed: 71001
    missing_class_policy: skip
    interval_method: percentile
