[project]
name = "mimiciv-research"
version = "0.1.0"
description = "Research on ML/LLM architectures for clinical sequential data from MIMIC-IV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",

    # LLM/Transformers
    "transformers>=4.47.0",
    "peft>=0.19.0",
    "accelerate>=0.25.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",

    # Utilities
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pandarallel>=1.6.5",

    # Domain-specific
    "networkx>=3.0",
    "icdmappings>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
